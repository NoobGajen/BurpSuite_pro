name: Windows installer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check help and syntax in Windows PowerShell 5.1
        shell: powershell
        run: |
          ./install.ps1 -h
          ./install.ps1 -Help
          $tokens = $null
          $parseErrors = $null
          $null = [Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Check help and syntax in PowerShell 7
        shell: pwsh
        run: |
          ./install.ps1 -h
          ./install.ps1 -Help
          $tokens = $null
          $parseErrors = $null
          $null = [Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
