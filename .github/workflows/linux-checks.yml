name: Linux installer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install check tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Check Python and desktop metadata
        run: |
          python3 -m py_compile install.py
          desktop-file-validate burpsuite-professional.desktop
      - name: Check installer help
        run: python3 install.py --help
